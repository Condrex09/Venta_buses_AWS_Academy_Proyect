      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Venta'
          description: ''
  /api/ventas/checkout/:
    post:
      operationId: ventas_checkout_create
      description: |-
        Toma el contenido del carro del pasajero, crea la Venta en estado PENDIENTE con sus registros asociados de DetalleVenta (precios unitarios congelados e inmutables), y vacía el carro.
        Regla crítica de negocio: Este paso NO descuenta stock ni marca asientos como ocupados.
      summary: 'Ejecutar checkout: crea orden PENDIENTE y congela precios en DetalleVenta'
      tags:
      - Ventas y Checkout (Pasajero)
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Venta'
          description: ''
        '400':
          description: Carro vacío o servicio zarpado.
components:
  schemas:
    Asiento:
      type: object
      description: |-
        Serializador para consultar y representar asientos físicos con su tipo de confort
        (SEMICAMA o CAMA), disponibilidad y precio asociado al servicio.
      properties:
        id:
          type: integer
          readOnly: true
        servicio_id:
          type: integer
          title: Servicio Asociado
          readOnly: true
        numero_asiento:
          type: integer
          readOnly: true
          title: Número de Asiento
          description: Número secuencial del asiento en el bus (ej. 1, 2, ..., 40).
        tipo_asiento:
          allOf:
          - $ref: '#/components/schemas/TipoAsientoEnum'
          title: Tipo de Asiento
          description: |-
            Categoría de confort del asiento (Semicama o Salón Cama).

            * `SEMICAMA` - Semicama
            * `CAMA` - Salón Cama
        tipo_asiento_display:
          type: string
          readOnly: true
        estado:
          allOf:
          - $ref: '#/components/schemas/EstadoAsientoEnum'
          title: Estado de Disponibilidad
        estado_display:
          type: string
          readOnly: true
        precio:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
      required:
      - estado_display
      - id
      - numero_asiento
      - precio
      - servicio_id
      - tipo_asiento_display
    AsientoAdmin:
      type: object
      description: Serializador para gestión administrativa directa de asientos (CRUD
        admin).
      properties:
        id:
          type: integer
          readOnly: true
        servicio:
          type: integer
          title: Servicio Asociado
        numero_asiento:
          type: integer
          maximum: 4294967295
          minimum: 0
          format: int64
          title: Número de Asiento
          description: Número secuencial del asiento en el bus (ej. 1, 2, ..., 40).
        tipo_asiento:
          allOf:
          - $ref: '#/components/schemas/TipoAsientoEnum'
          title: Tipo de Asiento
          description: |-
            Categoría de confort del asiento (Semicama o Salón Cama).

            * `SEMICAMA` - Semicama
            * `CAMA` - Salón Cama
        tipo_asiento_display:
          type: string
          readOnly: true
        estado:
          allOf:
          - $ref: '#/components/schemas/EstadoAsientoEnum'
          title: Estado de Disponibilidad
        estado_display:
          type: string
          readOnly: true
        precio:
          type: string
          format: decimal
