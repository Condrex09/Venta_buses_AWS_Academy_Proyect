          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BusRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BusRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bus'
          description: ''
