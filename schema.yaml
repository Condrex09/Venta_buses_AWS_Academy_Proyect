      description: |-
        Permite al Administrador de Flota cambiar el estado de una venta.
        Transiciones válidas: PENDIENTE->PAGADO, PENDIENTE->CANCELADO, PAGADO->ENTREGADO, PAGADO->CANCELADO.
        Cualquier otra transición es rechazada con HTTP 400.
      summary: Actualizar estado de una venta (Administrador de Flota)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
