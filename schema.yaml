      description: |-
        CRUD para gestión individual de asientos de servicios.
        Permite al Administrador de Flota actualizar tipo o estado de un asiento específico.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Asiento.
        required: true
      tags:
      - Gestión de Flota (Administrador)
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Genera un par de tokens (Access y Refresh) firmados con JWT.
        El payload del token incluye claims extendidos: `rol` (PASAJERO o ADMIN_FLOTA), `username`, `email` y `nombre_completo`.
        Adicionalmente, abre una sesión estándar en Django para compatibilidad con vistas web y Swagger.
      summary: Iniciar sesión y obtener tokens JWT con claims de rol
      tags:
      - Autenticación y Cuentas
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
        required: true
      responses:
        '200':
          description: Tokens generados exitosamente y sesión iniciada.
        '401':
          description: Credenciales de acceso inválidas.
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: |-
        Agrega el refresh token a la lista negra (Blacklist) impidiendo renovar accesos.
        Cierra también la sesión de Django en el servidor.
        IMPORTANTE: El carro de compras del usuario NO se elimina, persiste íntegro en MySQL.
      summary: Cerrar sesión y revocar Refresh Token (Blacklist)
      tags:
      - Autenticación y Cuentas
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh:
                  type: string
                  description: Token de refresco a revocar
              required:
              - refresh
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: Sesión cerrada exitosamente y token revocado.
        '400':
          description: Token de refresco inválido o faltante.
  /api/auth/perfil/:
    get:
      operationId: auth_perfil_retrieve
      description: Retorna los datos del usuario actualmente autenticado mediante
        el token Bearer JWT.
      summary: Consultar perfil del usuario autenticado
      tags:
      - Autenticación y Cuentas
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioDetalle'
          description: ''
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      description: |-
        Permite el auto-registro público de clientes.
        Por motivos de seguridad, todo registro público crea SIEMPRE un usuario con rol `PASAJERO`.
        Cualquier intento de enviar `rol: ADMIN_FLOTA`, `is_staff` o `is_superuser` es ignorado.
      summary: Registro de nuevo usuario pasajero
      tags:
      - Autenticación y Cuentas
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioRegistroRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UsuarioRegistroRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UsuarioRegistroRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioDetalle'
          description: ''
        '400':
          description: Errores de validación de datos o contraseñas no coincidentes.
  /api/buses/:
    get:
      operationId: buses_list
      description: CRUD para unidades de transporte de la flota BusDrex.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      - in: query
        name: tipo_bus
        schema:
          type: string
          title: Tipo / Categoría de Bus
          enum:
          - PREMIUM
          - SALON_CAMA
          - SEMICAMA
        description: |-
          * `SEMICAMA` - Semicama
          * `SALON_CAMA` - Salón Cama
          * `PREMIUM` - Premium / Cama Suite
      tags:
      - Catálogos de Geografía y Transporte
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBusList'
          description: ''
    post:
      operationId: buses_create
      description: CRUD para unidades de transporte de la flota BusDrex.
      tags:
