openapi: 3.0.3
info:
  title: BusDrex API - Gestión de Reservas de Pasajes de Buses Interurbanos
  version: 1.0.0
  description: |-
    ## Plataforma de Gestión de Reservas de Pasajes Interurbanos
    Inspirada en el portal y experiencia de usuario de **Turbus.cl**.

    ---
    ### Ficha Académica del Proyecto
    - **Estudiante:** Benjamin Gómez
    - **Asignatura:** Programación Back End
    - **Evaluación:** Evaluación 2 (Django REST Framework + MySQL)
    - **Sección:** AP-N4-C1
    - **Año Lectivo:** 2026
    ---

    ### Matriz de Autenticación y Autorización
    - **Público:** Consulta de rutas, itinerarios/servicios, asientos disponibles y ofertas.
    - **Pasajero (`rol: PASAJERO`):** Gestión de su carro persistente, checkout atómico, pago, consulta de órdenes y boletos emitidos.
    - **Administrador de Flota (`rol: ADMIN_FLOTA`):** CRUD de servicios, terminales, rutas, buses, asientos, ofertas, carros y actualización de estados de ventas.

    **Pie de Página Institucional:** BusDrex © 2026 | Benjamin Gómez | Sección AP-N4-C1
  contact:
    name: Benjamin Gómez (AP-N4-C1)
    email: benjamin.gomez@busdrex.cl
  license:
    name: Evaluación Académica 2 - Uso Académico 2026
paths:
  /api/admin/carros/:
    get:
      operationId: admin_carros_list
      description: Permite al Administrador de Flota auditar todos los carros de compras
        y vaciar o quitar ítems.
      tags:
      - Gestión de Carros (Administrador)
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CarroPasajes'
          description: ''
    delete:
      operationId: admin_carros_destroy
      description: Permite al Administrador de Flota auditar todos los carros de compras
        y vaciar o quitar ítems.
      tags:
      - Gestión de Carros (Administrador)
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CarroPasajes'
          description: ''
  /api/admin/usuarios/:
    get:
      operationId: admin_usuarios_list
      description: Permite al Administrador de Flota listar todos los usuarios del
        sistema, consultar detalles específicos y activar o desactivar cuentas (campo
        `is_active`).
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: is_staff
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - in: query
        name: rol
        schema:
          type: string
          title: Rol en el Sistema
          enum:
          - ADMIN_FLOTA
          - PASAJERO
        description: |-
          Define los privilegios de acceso (Pasajero o Administrador de Flota).

          * `PASAJERO` - Pasajero
          * `ADMIN_FLOTA` - Administrador de Flota
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      tags:
      - Gestión de Usuarios (Administrador)
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsuarioGestionAdminList'
          description: ''
  /api/admin/usuarios/{id}/:
    get:
      operationId: admin_usuarios_retrieve
      description: Permite al Administrador de Flota listar todos los usuarios del
        sistema, consultar detalles específicos y activar o desactivar cuentas (campo
        `is_active`).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Gestión de Usuarios (Administrador)
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioGestionAdmin'
          description: ''
    patch:
      operationId: admin_usuarios_partial_update
      description: Permite al Administrador de Flota listar todos los usuarios del
        sistema, consultar detalles específicos y activar o desactivar cuentas (campo
