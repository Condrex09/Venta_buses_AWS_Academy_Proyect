          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBusRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBusRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
