  /api/carro-pasajes/:
    get:
      operationId: carro_pasajes_retrieve
      description: Obtiene todos los asientos guardados en el carro activo del usuario
        con subtotales y total general.
      summary: Consultar contenido del carro de pasajes persistente
      tags:
      - Carro de Pasajes (Pasajero)
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarroPasajes'
          description: ''
    post:
      operationId: carro_pasajes_create
      description: 'Agrega un asiento seleccionado con los datos nominativos del pasajero
        (nombre y RUT). Normaliza el RUT y busca/crea la entidad Pasajero de forma
        normalizada (3FN). Si el RUT ya existe, se reutiliza el Pasajero sin sobreescribir
        su nombre. Regla de negocio: En este paso NO se descuenta el stock de asientos
        en la base de datos.'
      summary: Agregar pasaje al carro de compras
      tags:
      - Carro de Pasajes (Pasajero)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemCarroCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ItemCarroCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ItemCarroCreateRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemCarro'
          description: ''
        '400':
          description: Asiento no disponible, zarpado o ya agregado al carro.
    delete:
      operationId: carro_pasajes_destroy
      description: Si se provee el query parameter `?item_id=X`, elimina dicho ítem.
        Sin parámetro, vacía todo el carro.
      summary: Vaciar el carro o eliminar un ítem específico
      parameters:
      - in: query
        name: item_id
        schema:
          type: integer
        description: ID del ítem individual a eliminar (opcional)
      tags:
      - Carro de Pasajes (Pasajero)
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: Carro vaciado o ítem eliminado exitosamente.
  /api/ciudades/:
