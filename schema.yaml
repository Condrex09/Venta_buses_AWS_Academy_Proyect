        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsientoAdmin'
          description: ''
    patch:
      operationId: asientos_partial_update
      description: |-
        CRUD para gestión individual de asientos de servicios.
        Permite al Administrador de Flota actualizar tipo o estado de un asiento específico.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Asiento.
        required: true
      tags:
