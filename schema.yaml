      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bus'
          description: ''
    patch:
      operationId: buses_partial_update
      description: CRUD para unidades de transporte de la flota BusDrex.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Bus.
