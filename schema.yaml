          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUsuarioGestionAdminRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUsuarioGestionAdminRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioGestionAdmin'
          description: ''
  /api/asientos/:
    get:
      operationId: asientos_list
      description: |-
        CRUD para gestión individual de asientos de servicios.
        Permite al Administrador de Flota actualizar tipo o estado de un asiento específico.
      parameters:
      - in: query
        name: estado
        schema:
          type: string
          title: Estado de Disponibilidad
          enum:
          - DISPONIBLE
          - OCUPADO
        description: |-
          * `DISPONIBLE` - Disponible
          * `OCUPADO` - Ocupado
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      - in: query
        name: servicio
        schema:
          type: integer
      - in: query
        name: tipo_asiento
        schema:
          type: string
          title: Tipo de Asiento
          enum:
          - CAMA
          - SEMICAMA
        description: |-
          Categoría de confort del asiento (Semicama o Salón Cama).

          * `SEMICAMA` - Semicama
          * `CAMA` - Salón Cama
      tags:
      - Gestión de Flota (Administrador)
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAsientoAdminList'
          description: ''
    post:
      operationId: asientos_create
      description: |-
        CRUD para gestión individual de asientos de servicios.
        Permite al Administrador de Flota actualizar tipo o estado de un asiento específico.
      tags:
      - Gestión de Flota (Administrador)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsientoAdminRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AsientoAdminRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AsientoAdminRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsientoAdmin'
          description: ''
  /api/asientos/{id}/:
