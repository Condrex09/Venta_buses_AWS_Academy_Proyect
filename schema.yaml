  /api/ventas/{id}/pagar/:
    post:
      operationId: ventas_pagar_create
      description: |-
        Simula el pago de una orden en estado PENDIENTE.

        **Lógica Transaccional:**
        1. Bloqueo pesimista sobre las filas de los asientos en MySQL con `select_for_update()`.
        2. Valida atómicamente que TODOS los asientos sigan en estado `DISPONIBLE` y bus no haya zarpado.
        3. Si algún asiento está ocupado, se ejecuta Rollback completo y la orden se mantiene PENDIENTE (HTTP 400).
        4. Si todos están disponibles: Asientos pasan a `OCUPADO`, Venta a `PAGADO` y se emiten los Boletos (3FN OneToOne con DetalleVenta).
      summary: 'Pagar orden de venta: bloqueo pesimista select_for_update y emisión
        de boletos'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: ID de la Venta a pagar
        required: true
      tags:
      - Ventas y Checkout (Pasajero)
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Venta'
          description: ''
        '400':
          description: Conflicto de disponibilidad o servicio zarpado.
  /api/ventas/{id}/:
    get:
      operationId: ventas_retrieve
      description: Permite al Administrador de Flota auditar y filtrar todas las compras
        del sistema.
      summary: Listar todas las órdenes de venta del sistema con filtros avanzados
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
