    UsuarioRegistroRequest:
      type: object
      description: |-
        Serializador para el auto-registro de nuevos usuarios en BusDrex.
        REGLA DE SEGURIDAD CRÍTICA:
        - Todo auto-registro genera SIEMPRE un usuario con rol 'PASAJERO'.
        - El campo 'rol' es de solo lectura y cualquier valor enviado por el cliente es ignorado.
        - Se eliminó el campo 'rut' para respetar la Tercera Forma Normal (3FN).
        - Garantiza la creación inmediata del Carro de Pasajes (OneToOne) en la base de datos.
      properties:
        username:
          type: string
          minLength: 1
          title: Nombre de usuario
          description: 'Requerido. 150 carácteres como máximo. Únicamente letras,
            dígitos y @/./+/-/_ '
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          title: Dirección de correo electrónico
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        password:
          type: string
          writeOnly: true
          minLength: 6
          description: Contraseña mínima de 6 caracteres.
        confirmar_password:
          type: string
          writeOnly: true
          minLength: 6
          description: Confirmación idéntica de la contraseña.
        first_name:
          type: string
          title: Nombre
          maxLength: 150
        last_name:
          type: string
          title: Apellidos
          maxLength: 150
        telefono:
          type: string
          nullable: true
          title: Teléfono de Contacto
          description: Teléfono móvil para notificaciones de viaje (ej. +56912345678).
          maxLength: 20
      required:
      - confirmar_password
      - password
      - username
